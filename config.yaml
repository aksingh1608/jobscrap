# =============================================================================
# Daily Internship Job Aggregator — main settings
# Edit this file to steer filters, ranking, and sources. No code changes needed.
# =============================================================================

role_types:
  - internship
  - praktikum
  - praktikant
  - werkstudent
  - working student
  - research assistant
  - studentische hilfskraft
  - hiwi
  - shk

domains:
  - machine learning
  - deep learning
  - data science
  - data analysis
  - computer vision
  - nlp
  - llm
  - generative ai
  - mlops
  - devops
  - ai research
  - ai engineering

# At least one of these must appear in title or description
must_have_any:
  - python
  - ml
  - ai
  - data
  - machine learning
  - deep learning
  - nlp
  - llm
  - computer vision

exclude_words:
  - senior
  - lead
  - permanent
  - unbefristet
  - "full time manager"
  - director
  - principal
  - staff engineer
  - 5+ years
  - 3+ years experience

# Reject postings that require German above this CEFR level
german_max_level: A2
prefer_english: true

locations:
  - Germany
  - Remote
  - Berlin
  - München
  - Munich
  - Hamburg
  - Köln
  - Cologne
  - Frankfurt
  - Stuttgart
  - Düsseldorf
  - Deutschland

radius_km: 200
freshness_days: 7
min_fit_score: 55
max_per_day: 50
# Never send an empty sheet: if fewer than min_results clear min_fit_score,
# top up with the next best down to floor_fit_score (0 disables the top-up).
min_results: 15
# Hard line: below this a posting is not worth your time, so the top-up above
# will never reach for it. Off-domain "intern" roles land around 40–45 on this
# scale, so keep the floor above that.
floor_fit_score: 50

# Custom-site links with less text than this are listing-page noise, not jobs.
min_description_chars: 60
# Ceiling on raw postings pulled from any single source per run
max_raw_per_source: 200

# Time budgets, so a hanging or dead board can never overrun the daily schedule.
# A source that fails repeatedly is dropped for the rest of the run.
collect_budget_s: 2400       # whole collect stage (40 min)
custom_sites_budget_s: 900   # custom sites only (15 min)

retention:
  expire_days: 21      # unseen for this many days → retired from the sheet
  db_keep_days: 180    # delete expired rows older than this
  keep_exports: 30     # keep only the newest N dated .xlsx files

# Primary search location for JobSpy / Arbeitsagentur queries
search_location: Berlin
# Mixed English + German phrasing: German boards index the German wording, and
# a Werkstudent role is rarely advertised as an "internship".
search_queries:
  - machine learning internship
  - deep learning praktikum
  - data science werkstudent
  - AI internship
  - NLP internship
  - computer vision internship
  - MLOps internship
  - research assistant AI
  - studentische hilfskraft machine learning
  - werkstudent machine learning
  - werkstudent data science
  - praktikum künstliche intelligenz
  - praktikum data science
  - LLM internship
  - generative AI internship
  - data analyst werkstudent
  - python internship
  - master thesis machine learning

sources:
  # JobSpy boards — do NOT include linkedin (handled manually)
  jobspy:
    - indeed
    - glassdoor
    - google
    # zip_recruiter has limited DE coverage; enable if useful
    # - zip_recruiter
  arbeitsagentur: true
  # Plug-in list: add/remove URLs here only. Optional per-site overrides:
  #   - url: https://example.com/jobs
  #     name: Example
  #     enabled: true
  custom_sites:
    - url: https://www.stellenwerk.de/en/
      name: Stellenwerk
      enabled: true
    - url: https://englishjobs.de/in/berlin
      name: English Jobs
      enabled: true
    - url: https://www.work-in-berlin.eu/jobs/english
      name: Work in Berlin EU
      enabled: true
    - url: https://www.jobmensa.de/studentenjobs/berlin
      name: JobMensa
      enabled: true
    - url: https://www.youngcapital.de/jobs/berlin
      name: Young Capital
      enabled: true
    - url: https://www.thelocal.de/jobs
      name: The Local
      enabled: true
    - url: https://berlinstartupjobs.com
      name: Berlin Startup Jobs
      enabled: true
    - url: https://www.stepstone.de/en
      name: StepStone
      enabled: true
    - url: https://www.studentjob.de
      name: Student Job
      enabled: true
    - url: https://www.make-it-in-germany.com/en/
      name: Make it in Germany
      enabled: false
    - url: https://eures.ec.europa.eu/index_en
      name: EURES
      enabled: false

# Paste your CV summary / profile here — used for embedding fit score
profile_text: >
  Master's student in Artificial Intelligence in Berlin, Germany.
  Strong in Machine Learning, Deep Learning, NLP, LLMs, Computer Vision,
  Data Science, Python, PyTorch, TensorFlow, MLOps basics.
  Looking for Internship, Praktikum, Werkstudent, or Research Assistant /
  HiWi roles in AI, ML, data, or DevOps. German level A2; prefer English
  working language. Available in Berlin or remote within Germany.

# --- Scoring weights (also documented in src/rank.py) ---
# Each signal scores 0–1, then fit = 100 * weighted_average − penalties.
# Weights are relative: doubling all of them changes nothing.
scoring:
  semantic: 35               # embedding similarity vs profile_text
  role: 25                   # internship / Werkstudent / HiWi match (title > body)
  domain: 25                 # ML / AI / data match (title > body)
  recency: 8                 # newer posting → higher
  language: 7                # English working language
  german_penalty: 20         # -points if German required above A2
  exclude_penalty: 15        # -points if soft exclude signals remain
  # Cosine range used to rescale similarity. MiniLM rarely exceeds ~0.6 even on
  # a perfect match, so a raw score would bunch everything into 30–60.
  sim_floor: 0.15
  sim_ceil: 0.60

paths:
  sqlite: data/jobs.db
  exports_dir: exports
  log_file: data/pipeline.log

notify:
  # Set secrets via env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
  # or SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, NOTIFY_EMAIL_TO
  telegram: true
  email: false
  top_n: 10              # how many jobs to list in the daily message
  attach_excel: false    # email only — attach the dated workbook
  skip_when_empty: false # true = stay silent on days with no new matches
